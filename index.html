<!DOCTYPE html>
<html lang="ru">
<head>

  <style>
    .call-button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      margin: 10px 0;
    }
    .call-button:hover {
      background-color: #218838;
    }
    .review-button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #1e7e34;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 20px;
      border: none;
      cursor: pointer;
    }
    #reviews {
      display: none;
      margin-top: 20px;
    }
    .review {
      border-bottom: 1px solid #ccc;
      padding: 10px 0;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Контакты</h1>

  <p>Телефон 1: <a href="tel:0952281220">095 228 1220</a></p>

 <section id="reviews">

  <script>
    function toggleReviews() {
      const reviewSection = document.getElementById("reviews");
      reviewSection.style.display = reviewSection.style.display === "none" ? "block" : "none";
    }
  </script>
