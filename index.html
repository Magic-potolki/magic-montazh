<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Монтаж потолков | Грильято, Кубообразная рейка, Украина</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .call-button, .review-button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      margin: 10px 0;
      border: none;
      cursor: pointer;
    }
    .review-button:hover, .call-button:hover {
      background-color: #218838;
    }
    #reviews {
      display: none;
      margin-top: 20px;
    }
    .review {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 15px;
      margin-bottom: 10px;
    }
    .review strong {
      color: #333;
    }
    iframe {
      border: none;
      width: 100%;
      height: 500px;
      margin-bottom: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>Контакты</h1>
  <p>Город: Днепр</p>
  <p>Телефон 1: <a href="tel:0952281220">095 228 1220</a></p>
  <p>Телефон 2: <a href="tel:0970073990">097 007 3990</a></p>
  <p>Имя: Дмитрий</p>

  <!-- КНОПКА ДЛЯ ОТЗЫВОВ -->
  <button class="review-button" onclick="toggleReviews()">Показать отзывы клиентов</button>

  <!-- СЕКЦИЯ ОТЗЫВОВ -->
  <div id="reviews">
    <h2>Оставить отзыв</h2>
    
    <!-- ВСТРОЕННАЯ GOOGLE ФОРМА -->
    <iframe 
      src="https://docs.google.com/forms/d/e/1FAIpQLScpQS3Lij5_XG3AD9ezqsICGHaap1INbF_YIpgdFcpn_m5lZw/viewform?embedded=true" 
      allowfullscreen>
      Загрузка…
    </iframe>

    <h2>Отзывы клиентов</h2>
    <div id="review-list">Загрузка отзывов...</div>
  </div>

  <script>
    function toggleReviews() {
      const reviews = document.getElementById("reviews");
      reviews.style.display = reviews.style.display === "none" ? "block" : "none";
    }

    async function loadReviews() {
      const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcdyH4EsEsUTBMQgLrXGmKc3ma4tVKTVTvKGKA8h-_hWljV28Ugz-mGEo9pvwMJnkN5GCm1GSXQ9c7/pub?output=csv";
      
      try {
        const response = await fetch(url);
        const text = await response.text();
        const rows = text.trim().split("\n").slice(1); // пропускаем заголовки
        const list = document.getElementById("review-list");
        list.innerHTML = "";
rows.forEach(row => {
  const cells = row.split(",").map(cell => cell.replace(/\"/g, '').trim());
  const name = cells[1]; // имя
  const message = cells[2]; // отзыв

  const div = document.createElement("div");
  div.className = "review";
  div.innerHTML = `<p><strong>${name}</strong></p><p>${message}</p>`;
  list.appendChild(div);
});

     
      } catch (error) {
        document.getElementById("review-list").innerText = "Ошибка загрузки отзывов.";
      }
    }

    window.onload = loadReviews;
  </script>
</body>
</html>
