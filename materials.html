<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Купить материалы и комплектующие — Magic Потолки</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
      color: #333;
    }
    h1 {
      color: #28a745;
      margin-bottom: 30px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    th, td {
      padding: 15px 20px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 16px;
    }
    th {
      background-color: #28a745;
      color: white;
      font-weight: bold;
    }
    tr:hover {
      background-color: #f1f9f1;
    }
    a {
      color: #28a745;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    /* Ссылка назад */
    #back-link {
      display: inline-block;
      margin-top: 20px;
      color: #28a745;
      font-weight: bold;
      text-decoration: none;
      border: 2px solid #28a745;
      padding: 8px 15px;
      border-radius: 10px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    #back-link:hover {
      background-color: #28a745;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Купить материалы и комплектующие</h1>

  <!-- Здесь будет таблица с товарами и ценами -->
  <p style="text-align: center; color: #555;">Здесь скоро появится каталог материалов и цены.</p>

  <a id="back-link" href="index.html">← Вернуться на главную</a>
</body>
</html>
